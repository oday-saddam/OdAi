<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>odAi</title>
<meta name="description" content="odAi — محادثة وتوليد صور وفيديو وصوت من واجهة واحدة.">
<meta name="theme-color" content="#16181b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="odAi">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><path d="M3 6h9M16 6h5M3 12h3M10 12h11M3 18h11M18 18h3"/><circle cx="14" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="18" r="2"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5"/></symbol>
<symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></symbol>
<symbol id="i-video" viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="3"/><path d="m16 10 6-3.5v11L16 14"/></symbol>
<symbol id="i-audio" viewBox="0 0 24 24"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></symbol>
<symbol id="i-text" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h14"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15H4.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V5"/></symbol>
<symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
<symbol id="i-wallet" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.5 9.5c-.5-1-1.5-1.5-2.5-1.5-1.5 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1 2-2.5 2c-1 0-2-.5-2.5-1.5M12 6.5V8M12 16v1.5"/></symbol>
<symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></symbol>
<symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 20V8M7 13l5-5 5 5M5 4h14"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.9 6.2.8-4.6 4.3 1.2 6.3L12 17.3 6.4 20.3l1.2-6.3L3 9.7l6.2-.8z"/></symbol>
<symbol id="i-clip" viewBox="0 0 24 24"><path d="M20 11l-8.5 8.5a5 5 0 0 1-7-7L13 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L14 7"/></symbol>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
<symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 9.2-9.2M16 7l3 3"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-move" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 13h6M13 11l2 2-2 2"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
<symbol id="i-split" viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="16" rx="2"/><rect x="13" y="4" width="8" height="16" rx="2"/></symbol>
<symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-9"/></symbol>
<symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 17v5M8 3h8l-1 6 3 3H6l3-3z"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></symbol>
<symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>
</svg>

<div class="app" id="app">
  <div class="scrim" id="scrim"></div>
  <aside class="side" id="side">
    <div class="side-top">
      <div class="brand" id="brand"></div>
      <button class="ic only-narrow" id="closeSide" aria-label="إغلاق"><svg class="i"><use href="#i-x"/></svg></button>
    </div>
    <button class="newchat" id="newChat"><svg class="i"><use href="#i-plus"/></svg>محادثة جديدة</button>
    <div class="quick"><button class="btn" id="openGallery"><svg class="i"><use href="#i-grid"/></svg>المعرض</button><button class="btn" id="openCompare"><svg class="i"><use href="#i-split"/></svg>مقارنة</button></div>
    <div class="search"><svg class="i"><use href="#i-search"/></svg><input id="q" placeholder="ابحث في المحادثات" autocomplete="off"></div>
    <div class="side-scroll" id="sideList"></div>
    <div class="side-foot">
      <button class="credit" id="credit" title="تحديث الرصيد"></button>
      <button class="ic" id="openReport" aria-label="تقرير الصرف" style="height:auto;border:1px solid var(--bd);background:var(--bg)"><svg class="i"><use href="#i-chart"/></svg></button>
      <button class="ic" id="openSettings" aria-label="الإعدادات" style="height:auto;border:1px solid var(--bd);background:var(--bg)"><svg class="i"><use href="#i-settings"/></svg></button>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <button class="ic only-narrow" id="openSide" aria-label="القائمة"><svg class="i"><use href="#i-menu"/></svg></button>
      <button class="chip model" id="modelChip"></button>
      <button class="chip" id="thinkChip"></button>
      <div class="sp"></div>
      <div class="chip cost" id="costChip" title="تكلفة هذه المحادثة"></div>
    </header>
    <div class="scroll" id="scroll"><div class="thread" id="thread"></div></div>
    <div class="comp">
      <div class="box">
        <div class="pend" id="pend"></div>
        <textarea id="inp" rows="1" placeholder="اكتب رسالتك…"></textarea>
        <div class="est" id="est"></div>
        <div class="bar">
          <button class="ic" id="attach" aria-label="إرفاق صورة"><svg class="i"><use href="#i-clip"/></svg></button>
          <button class="ic" id="mic" aria-label="إدخال صوتي"><svg class="i"><use href="#i-mic"/></svg></button>
          <button class="ic" id="webBtn" aria-label="البحث في الإنترنت" title="البحث في الإنترنت"><svg class="i"><use href="#i-globe"/></svg></button>
          <button class="ic agent-toggle" id="agentBtn" aria-label="وضع الوكيل" title="وضع الوكيل: إنشاء وتحديث ملفات قابلة للتنزيل" aria-pressed="false"><svg class="i"><use href="#i-bulb"/></svg><span>وكيل</span></button>
          <div class="opts" id="opts"></div>
          <button class="send" id="send" aria-label="إرسال"></button>
        </div>
      </div>
    </div>
    <input type="file" id="file" accept="image/*,application/pdf,.pdf,.txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.xml,.yaml,.yml,.log,.sql,.sh,.java,.c,.cpp,.go,.rs" multiple hidden>
  </main>
</div>
<div id="mr"></div>
<datalist id="tm-list"></datalist>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
