<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>odAi</title>
<meta name="theme-color" content="#16181b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="odAi">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#16181b;--s1:#1c1f23;--s2:#23272c;--s3:#2c3137;--bd:#2f353b;--tx:#f4f6f7;--mu:#98a2ab;--ac:#22d3ee;--acx:#04222a;--er:#ff7b7b;--f:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:400 1rem/1.75 var(--f);-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--ac) 35%,transparent)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--s3);border-radius:8px}
.i{width:1.15rem;height:1.15rem;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.fill{fill:currentColor;stroke:none}
.mu{color:var(--mu)}.pad{padding:1rem}

.app{display:flex;height:100dvh}
.side{width:300px;flex:none;background:var(--s1);border-inline-end:1px solid var(--bd);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.scrim{display:none}
